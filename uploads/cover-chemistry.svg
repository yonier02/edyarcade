<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <rect width="400" height="240" fill="#E0F2FE"/>
  <!-- Decorative grid lines -->
  <line x1="0" y1="60" x2="400" y2="60" stroke="#BAE6FD" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="0" y1="120" x2="400" y2="120" stroke="#BAE6FD" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="0" y1="180" x2="400" y2="180" stroke="#BAE6FD" stroke-width="2" stroke-dasharray="6 6"/>
  <!-- Flask -->
  <g transform="translate(140, 30)">
    <path d="M 50 15 L 70 15 L 70 50 L 105 130 C 110 142, 100 150, 85 150 L 35 150 C 20 150, 10 142, 15 130 L 50 50 Z" fill="#2EC4B6" stroke="#0F172A" stroke-width="5"/>
    <ellipse cx="60" cy="15" rx="14" ry="4" fill="#E2E8F0" stroke="#0F172A" stroke-width="4"/>
    <!-- Liquid -->
    <path d="M 23 130 C 28 145, 92 145, 97 130 L 80 90 L 40 90 Z" fill="#FF6B35" opacity="0.9"/>
    <!-- Bubbles -->
    <circle cx="50" cy="115" r="5" fill="#FFF" opacity="0.8"/>
    <circle cx="70" cy="105" r="4" fill="#FFF" opacity="0.8"/>
    <circle cx="60" cy="80" r="3" fill="#FFF" opacity="0.8"/>
  </g>
  <rect x="20" y="20" width="70" height="30" rx="6" fill="#FEF08A" stroke="#0F172A" stroke-width="3"/>
  <text x="32" y="41" font-family="'Space Mono', monospace" font-size="14" font-weight="bold" fill="#0F172A">NaCl</text>
  <rect x="310" y="160" width="70" height="30" rx="6" fill="#FEF08A" stroke="#0F172A" stroke-width="3"/>
  <text x="322" y="181" font-family="'Space Mono', monospace" font-size="14" font-weight="bold" fill="#0F172A">H₂O</text>
</svg>
