<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <rect width="400" height="240" fill="#FCE7F3"/>
  <!-- Book / Quill / Word puzzle pieces -->
  <g transform="translate(100, 40)">
    <rect x="20" y="30" width="160" height="110" rx="8" fill="#FFF" stroke="#0F172A" stroke-width="4"/>
    <line x1="100" y1="30" x2="100" y2="140" stroke="#0F172A" stroke-width="3"/>
    <!-- Text lines -->
    <line x1="35" y1="55" x2="85" y2="55" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="35" y1="75" x2="75" y2="75" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="35" y1="95" x2="80" y2="95" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="115" y1="55" x2="165" y2="55" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="115" y1="75" x2="155" y2="75" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="115" y1="95" x2="160" y2="95" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <!-- Pencil -->
    <g transform="translate(140, 10) rotate(25)">
      <polygon points="0,0 15,-10 90,40 75,50" fill="#F59E0B" stroke="#0F172A" stroke-width="3"/>
      <polygon points="0,0 15,-10 -10,0" fill="#E2E8F0" stroke="#0F172A" stroke-width="3"/>
      <polygon points="-10,0 -3, -2 -5, 2" fill="#0F172A"/>
    </g>
  </g>
</svg>
