<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <rect width="400" height="240" fill="#FEF3C7"/>
  <!-- Mathematical symbols and graphs -->
  <g transform="translate(60, 40)">
    <!-- Lightning bolt -->
    <polygon points="140,10 110,80 150,80 120,160 190,70 150,70" fill="#FF6B35" stroke="#0F172A" stroke-width="5" stroke-linejoin="round"/>
    <!-- Badges -->
    <rect x="0" y="20" width="80" height="40" rx="8" fill="#FFF" stroke="#0F172A" stroke-width="3"/>
    <text x="18" y="47" font-family="'Space Mono', monospace" font-size="20" font-weight="bold" fill="#0F172A">x² - 4</text>
    <rect x="200" y="100" width="80" height="40" rx="8" fill="#2EC4B6" stroke="#0F172A" stroke-width="3"/>
    <text x="216" y="127" font-family="'Space Mono', monospace" font-size="20" font-weight="bold" fill="#0F172A">∑ ± √</text>
  </g>
</svg>
